apply plugin: 'com.android.application'

android {
    namespace = "com.macrotrackr.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.macrotrackr.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 2
        versionName "3.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (System.getenv("KEYSTORE_FILE") != null) {
                storeFile file(System.getenv("KEYSTORE_FILE"))
                storePassword System.getenv("KEYSTORE_PASSWORD")
                keyAlias System.getenv("KEY_ALIAS")
                keyPassword System.getenv("KEY_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            if (System.getenv("KEYSTORE_FILE") != null) {
                signingConfig signingConfigs.release
            }
            // Keep rules for R8 are already written in proguard-rules.pro.
            // Flipping this to true needs a signed build smoke-tested on a
            // device first — R8 breakage in a Capacitor app shows up at
            // runtime as a silently missing plugin, never at build time.
            // See docs/android-release-build.md.
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

// Fail release builds when the assets were synced from a dev profile
// (localhost hostname / cleartext), which would ship a broken, cleartext
// webview to the store. Run 'bun run cap:sync:prod' to fix.
tasks.register("verifyReleaseCapacitorConfig") {
    doLast {
        def capConfigFile = file("$projectDir/src/main/assets/capacitor.config.json")
        if (!capConfigFile.exists()) {
            throw new GradleException("capacitor.config.json missing — run 'bunx cap sync' first.")
        }
        def capConfig = new groovy.json.JsonSlurper().parse(capConfigFile)
        def hostname = capConfig.server?.hostname
        def cleartext = capConfig.server?.cleartext
        if (hostname != "app.macrotrackr.com" || cleartext) {
            throw new GradleException(
                "capacitor.config.json is a dev profile (hostname=${hostname}, cleartext=${cleartext}). " +
                "Run 'bun run cap:sync:prod' before building a release.")
        }
    }
}

["assembleRelease", "bundleRelease"].each { name ->
    tasks.matching { it.name == name }.configureEach {
        dependsOn "verifyReleaseCapacitorConfig"
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "com.android.billingclient:billing:$playBillingVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
