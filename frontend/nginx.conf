server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Don't advertise the nginx version in responses and error pages.
  server_tokens off;

  # Baseline security headers. `always` so they also apply to error responses.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # camera is `(self)`, not `()`: the barcode scanner calls getUserMedia, and an
  # empty allowlist denies the camera to our own origin too — Chrome rejects the
  # call outright without prompting, and the user cannot grant it back from site
  # settings. Everything else stays denied.
  add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), interest-cohort=()" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;

  # HSTS is only meaningful over TLS; harmless on plain HTTP requests.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # App scripts are bundled, so no inline script is permitted. The remote
  # origins are the SDKs that load their own code at runtime (Clerk, PostHog,
  # Stripe) and are only reachable in managed mode. 'unsafe-inline' styles are
  # required by Tailwind and by Clerk's injected component styles.
  #
  # *.macrotrackr.com is required because Clerk is served from custom domains
  # (clerk.macrotrackr.com for clerk-js and its chunks, accounts.macrotrackr.com
  # for the Account Portal). 'self' is the apex only, and neither *.clerk.com
  # nor *.clerk.accounts.dev matches a custom domain, so without this the SDK
  # fails to load with a ChunkLoadError partway through sign-in.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.macrotrackr.com https://*.clerk.accounts.dev https://*.clerk.com https://challenges.cloudflare.com https://*.posthog.com https://js.stripe.com; style-src 'self' 'unsafe-inline' https://*.macrotrackr.com https://fonts.googleapis.com; font-src 'self' https://*.macrotrackr.com https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https:; worker-src 'self' blob: data:; frame-src https://*.macrotrackr.com https://challenges.cloudflare.com https://js.stripe.com https://*.clerk.accounts.dev https://*.clerk.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

  location /api/ {
    proxy_pass http://backend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # NOTE: an `add_header` in a location block discards every `add_header`
  # inherited from the server block, so the security headers below must be
  # repeated in each location that sets one of its own.

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://*.macrotrackr.com https://*.clerk.accounts.dev https://*.clerk.com https://challenges.cloudflare.com https://*.posthog.com https://js.stripe.com; style-src 'self' 'unsafe-inline' https://*.macrotrackr.com https://fonts.googleapis.com; font-src 'self' https://*.macrotrackr.com https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https:; worker-src 'self' blob: data:; frame-src https://*.macrotrackr.com https://challenges.cloudflare.com https://js.stripe.com https://*.clerk.accounts.dev https://*.clerk.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    try_files $uri =404;
  }

  location = /service-worker.js {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    try_files $uri =404;
  }

  location ^~ /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    try_files $uri =404;
  }

  location ~* \.(png|webp|ico|jpg|svg)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    try_files $uri =404;
  }

  # Prevent serving index.html for non-existent files with extensions (e.g. .xml, .php, .txt)
  location ~ \..+$ {
    try_files $uri =404;
  }

  # Prevent serving index.html for common CMS scanner paths
  location ~* ^/(wp-admin|wp-content|wp-includes|wp-json|wp-config|wp-login|plugins|administrator|components|cgi-bin)/ {
    return 404;
  }

  location / {
    # Pre-rendered public routes are directories containing index.html. Test
    # that file directly so nginx serves the canonical no-slash URL instead of
    # issuing a scheme-downgrading directory redirect behind TLS-terminating
    # reverse proxies such as Traefik or Cloudflare.
    try_files $uri/index.html $uri /index.html;
  }
}
