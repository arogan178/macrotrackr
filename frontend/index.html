<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/mark.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="MacroTrackr" />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/inter-latin-variable.woff2"
      crossorigin
    />
    <meta
      name="description"
      content="Log meals in seconds, set a macro split, and see where the week actually went. Free, open source, and self-hostable."
    />
    <meta
      name="keywords"
      content="macro tracking, macronutrients, nutrition tracker, MacroTrackr, macro tracker"
    />
    <meta name="robots" content="index,follow" />
    <link rel="canonical" href="https://macrotrackr.com/" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="MacroTrackr" />
    <meta
      property="og:title"
      content="MacroTrackr — Know what you ate, without the admin"
    />
    <meta
      property="og:description"
      content="Log meals in seconds, set a macro split, and see where the week actually went. Free, open source, and self-hostable."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="MacroTrackr — Know what you ate, without the admin"
    />
    <meta
      name="twitter:description"
      content="Log meals in seconds, set a macro split, and see where the week actually went. Free, open source, and self-hostable."
    />
    <meta name="twitter:image" content="/icon.png" />

    <!-- Structured data (Organization) with alternateName to capture common misspelling -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "MacroTrackr",
        "alternateName": ["MacroTracker", "Macro Trackr"],
        "logo": "/icon.png",
        "url": "https://macrotrackr.com/"
      }
    </script>

    <meta name="application-name" content="MacroTrackr" />
    <title>MacroTrackr</title>
  </head>
  <body>
    <noscript>
      MacroTrackr requires JavaScript to run. Please enable JavaScript to use the app.
      <br />
      <a href="/privacy">Privacy Policy</a> | <a href="/terms">Terms of Service</a>
    </noscript>
    <div id="root"></div>
    <div id="modal-root"></div>
    <!-- Add this div for portals -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
