name: Quality Gate

on:
  push:
    branches: [ develop, master ]
  pull_request:
    branches: [ develop, master ]
  workflow_call:


jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      working-directory: ./backend
      run: bun install

    - name: Typecheck
      working-directory: ./backend
      run: bun run typecheck

    - name: Lint
      working-directory: ./backend
      run: bun run lint

    - name: Test
      working-directory: ./backend
      run: bun run test

  frontend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        # Depth 1 fetches the merge commit and none of its parents, and the UI
        # budget check needs the base.
        fetch-depth: 0

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: latest

    - name: Install dependencies
      working-directory: ./frontend
      run: bun install

    - name: Typecheck
      working-directory: ./frontend
      run: bun run typecheck

    - name: Lint
      working-directory: ./frontend
      env:
        # Base branch tip for a pull request, previous head for a push. Empty
        # otherwise, and the check falls back to the budget alone.
        UI_BUDGET_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      run: bun run lint

    # Five releases' worth of drift went unnoticed because this only ever ran
    # by hand. A release note with no post is a release nobody was told about.
    - name: Check release notes have posts
      working-directory: ./frontend
      run: bun run release:blog --check

    - name: Build
      working-directory: ./frontend
      run: bun run build
