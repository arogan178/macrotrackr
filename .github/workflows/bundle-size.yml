name: Bundle Size Check

on:
  pull_request:
    branches: [ master ]
    paths:
    - 'frontend/**'
    - '.github/workflows/bundle-size.yml'

jobs:
  check-bundle:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Setup Bun
      uses: oven-sh/setup-bun@v2

    - name: Install dependencies
      working-directory: frontend
      run: bun install

    # Production build args, so the numbers match what ships. The Clerk and
    # PostHog keys are inert placeholders: the build only inlines them.
    - name: Build with analysis
      working-directory: frontend
      env:
        VITE_AUTH_MODE: clerk
        VITE_BILLING_MODE: managed
        VITE_ANALYTICS_MODE: posthog
        VITE_ENABLE_POSTHOG: "true"
        VITE_SUPPORT_EMAIL: support@macrotrackr.com
        VITE_CLERK_PUBLISHABLE_KEY: pk_test_ZXhhbXBsZS5jbGVyay5hY2NvdW50cy5kZXYk
        VITE_PUBLIC_POSTHOG_KEY: phc_bundle_size_placeholder
        VITE_PUBLIC_POSTHOG_HOST: https://us.i.posthog.com
      run: bun run build

    - name: Check bundle size
      working-directory: frontend
      run: bun run bundle:size
